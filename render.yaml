services:
  - type: web
    name: pondtwin
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: PONDTWIN_SUPABASE_URL
        sync: false
      - key: PONDTWIN_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: PONDTWIN_CORS_ORIGINS
        value: '["https://pondtwin.onrender.com"]'
      - key: PONDTWIN_TELEMETRY_INTERVAL_SECONDS
        value: "60"
